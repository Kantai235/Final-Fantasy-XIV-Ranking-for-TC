name: 更新排行榜資料

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-rankings:
    name: 抓取 FFLogs 並更新排行榜
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 儲存庫程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: 安裝 Python 依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 執行 FFLogs 排行榜抓取腳本
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
          FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
          FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
          FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
        run: python scripts/fetch_fflogs.py

      - name: 產生個人成績單資料
        run: node scripts/build_user_data.mjs

      - name: 檢查排行榜資料是否有變動
        id: data-changes
        run: |
          if [ -n "$(git status --porcelain data public/data/encounters.json public/data/global_stats.json)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit 並 Push 排行榜資料
        if: steps.data-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data public/data/encounters.json public/data/global_stats.json
          git commit -m "chore: 自動更新排行榜資料"
          git push origin HEAD:${{ github.ref_name }}
