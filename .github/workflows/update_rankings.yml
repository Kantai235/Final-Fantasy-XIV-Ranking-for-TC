name: 更新排行榜資料

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-rankings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}

jobs:
  update-rankings:
    name: 抓取 FFLogs 並更新排行榜
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout 儲存庫程式碼
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: 同步最新分支狀態
        run: |
          git fetch origin "${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: 安裝 Python 依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安裝 Node.js 依賴套件
        run: npm ci

      - name: 同步 Cloudflare CDN 規則
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_RULES_API_TOKEN: ${{ secrets.CLOUDFLARE_RULES_API_TOKEN }}
          CLOUDFLARE_HOSTNAME: ${{ vars.CLOUDFLARE_HOSTNAME }}
          CLOUDFLARE_MANAGE_RATE_LIMIT: ${{ vars.CLOUDFLARE_MANAGE_RATE_LIMIT }}
        run: |
          if [ -z "$CLOUDFLARE_RULES_API_TOKEN" ]; then
            echo "未設定 CLOUDFLARE_RULES_API_TOKEN，略過 Cloudflare Cache Rules / Rate Limiting Rules 同步。"
            exit 0
          fi

          CLOUDFLARE_APPLY_ARGS=(--allow-transient-failure)
          if [ "$CLOUDFLARE_MANAGE_RATE_LIMIT" = "false" ]; then
            CLOUDFLARE_APPLY_ARGS+=(--skip-rate-limit)
          fi
          npm run cloudflare:apply -- "${CLOUDFLARE_APPLY_ARGS[@]}"

      - name: 執行 FFLogs 排行榜抓取腳本
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
          FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
          FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
          FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
          # 玩家可能把繁中服角色的 report 上傳到其他地區；workflow 掃全部地區候選，再由 Python 以伺服器名稱篩繁中服玩家。
          FFLOGS_REPORT_REGION_SCOPE: ${{ vars.FFLOGS_REPORT_REGION_SCOPE || 'all' }}
          # 近期完整重查只回溯 24 小時；這段會放行近期 no-clear report 重新深查，避免剛匯出的 kill 被快取擋住。
          FFLOGS_INCREMENTAL_LOOKBACK_HOURS: ${{ vars.FFLOGS_INCREMENTAL_LOOKBACK_HOURS || '24' }}
          # 近期 report 可能先被掃到但尚未出現通關 fight；保留 24 小時重試窗，避免 skipped_no_clear 永久擋掉後續匯出的 kill。
          FFLOGS_NO_CLEAR_RETRY_HOURS: ${{ vars.FFLOGS_NO_CLEAR_RETRY_HOURS || '24' }}
          # 延遲淺層掃描固定檢查 24-72 小時前的 reports，只選入 state 與排行榜都沒見過的新 report，不重查既有紀錄。
          FFLOGS_DELAYED_SCAN_ENABLED: ${{ vars.FFLOGS_DELAYED_SCAN_ENABLED || 'true' }}
          FFLOGS_DELAYED_SCAN_RECENT_GAP_HOURS: ${{ vars.FFLOGS_DELAYED_SCAN_RECENT_GAP_HOURS || '24' }}
          FFLOGS_DELAYED_SCAN_LOOKBACK_HOURS: ${{ vars.FFLOGS_DELAYED_SCAN_LOOKBACK_HOURS || '72' }}
          FFLOGS_DELAYED_MAX_DEEP_REPORTS_PER_RUN: ${{ vars.FFLOGS_DELAYED_MAX_DEEP_REPORTS_PER_RUN || '0' }}
          # config/fflogs.json 預設關閉歷史補查；workflow 每輪掃 1 個 168 小時視窗，最多選入 2000 份深層候選。
          FFLOGS_HISTORY_SCAN_ENABLED: ${{ vars.FFLOGS_HISTORY_SCAN_ENABLED || 'true' }}
          FFLOGS_HISTORY_SCAN_FULL_RUN: ${{ vars.FFLOGS_HISTORY_SCAN_FULL_RUN || 'false' }}
          FFLOGS_HISTORY_SCAN_WINDOW_HOURS: ${{ vars.FFLOGS_HISTORY_SCAN_WINDOW_HOURS || '168' }}
          FFLOGS_HISTORY_SCAN_WINDOWS_PER_RUN: ${{ vars.FFLOGS_HISTORY_SCAN_WINDOWS_PER_RUN || '1' }}
          FFLOGS_HISTORY_SCAN_RECENT_GAP_HOURS: ${{ vars.FFLOGS_HISTORY_SCAN_RECENT_GAP_HOURS || '6' }}
          FFLOGS_HISTORY_MAX_DEEP_REPORTS_PER_RUN: ${{ vars.FFLOGS_HISTORY_MAX_DEEP_REPORTS_PER_RUN || '2000' }}
          FFLOGS_HISTORY_MAX_DEEP_REPORTS_PER_GROUP_PER_RUN: ${{ vars.FFLOGS_HISTORY_MAX_DEEP_REPORTS_PER_GROUP_PER_RUN || '500' }}
          # 每輪由舊到新抽查既有排行榜 report 是否仍可存取，跑完後會從最舊紀錄重新輪巡。
          FFLOGS_EXISTING_REPORT_STATUS_CHECK_ENABLED: ${{ vars.FFLOGS_EXISTING_REPORT_STATUS_CHECK_ENABLED || 'true' }}
          FFLOGS_EXISTING_REPORT_STATUS_CHECK_LIMIT: ${{ vars.FFLOGS_EXISTING_REPORT_STATUS_CHECK_LIMIT || '200' }}
          # 新 report 抓取時順手查同一場 Casts graph 並以本地演算法計算 GCD，只保存衍生結果。
          FFLOGS_FETCH_GCD_COVERAGE_ENABLED: ${{ vars.FFLOGS_FETCH_GCD_COVERAGE_ENABLED || 'true' }}
          FFLOGS_FETCH_GCD_COVERAGE_MAX_FIGHTS_PER_RUN: ${{ vars.FFLOGS_FETCH_GCD_COVERAGE_MAX_FIGHTS_PER_RUN || '500' }}
        run: python scripts/fetch_fflogs.py

      - name: 執行 Honey B. Lovely 粉絲榜抓取腳本
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
          FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
          FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
          FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
          HONEY_FANS_RECENT_DAYS: ${{ vars.HONEY_FANS_RECENT_DAYS || '3' }}
          HONEY_FANS_HISTORY_LIMIT: ${{ vars.HONEY_FANS_HISTORY_LIMIT || '200' }}
          HONEY_FANS_RECENT_WINDOW_HOURS: ${{ vars.HONEY_FANS_RECENT_WINDOW_HOURS || '24' }}
          HONEY_FANS_HISTORY_WINDOW_HOURS: ${{ vars.HONEY_FANS_HISTORY_WINDOW_HOURS || '24' }}
        run: |
          npm run fetch:honey-fans -- \
            --recent-days "${HONEY_FANS_RECENT_DAYS:-3}" \
            --history-limit "${HONEY_FANS_HISTORY_LIMIT:-200}" \
            --recent-window-hours "${HONEY_FANS_RECENT_WINDOW_HOURS:-24}" \
            --history-window-hours "${HONEY_FANS_HISTORY_WINDOW_HOURS:-24}"

      # 舊版資料修補工具暫停每輪自動執行，避免排程重複回查已不常需要補齊的歷史 report。
      # 若未來需要人工修復既有缺漏，保留以下步驟作為手動恢復時的上下文。
      # - name: 補齊缺漏 FFLogs 原始資料
      #   env:
      #     FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
      #     FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
      #     FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
      #     FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
      #     FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
      #   run: python scripts/backfill_missing_fflogs_data.py --limit 250

      - name: 由新往舊補齊既有 report 的 GCD 覆蓋率
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
          FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
          FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
          FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
          FFLOGS_GCD_BACKFILL_REPORT_LIMIT: ${{ vars.FFLOGS_GCD_BACKFILL_REPORT_LIMIT || '200' }}
          FFLOGS_GCD_BACKFILL_CUTOFF_ISO: ${{ vars.FFLOGS_GCD_BACKFILL_CUTOFF_ISO }}
        run: |
          python scripts/backfill_gcd_coverage.py \
            --stateful-report-backfill \
            --report-limit "${FFLOGS_GCD_BACKFILL_REPORT_LIMIT:-200}"

      - name: 分割完整排行榜資料供 Git 追蹤
        run: python scripts/fetch_fflogs.py --split-rankings

      - name: 產生個人成績單與排行榜薄索引資料
        run: npm run build:user-data

      - name: 重建 Honey B. Lovely 粉絲榜公開資料
        run: npm run build:honey-fans

      - name: Sync user leaderboard data to dedicated repository
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: |
          set -euo pipefail
          if [ -z "${GIT_PAT:-}" ]; then
            echo "GIT_PAT is missing. Define it in repository secrets."
            exit 1
          fi

          USER_REPO_URL="https://x-access-token:${GIT_PAT}@github.com/Kantai235/Final-Fantasy-XIV-Ranking-for-TC-Users.git"
          USER_REPO_DIR="${RUNNER_TEMP}/Final-Fantasy-XIV-Ranking-for-TC-Users"
          USER_DATA_SYNC_CHANGED_FILE="$USER_REPO_DIR/.user_data_sync_changed"
          rm -rf "$USER_REPO_DIR"
          git clone "$USER_REPO_URL" "$USER_REPO_DIR"

          for required_user_data_dir in public/data/users public/data/user-entry-details; do
            if [ ! -d "$required_user_data_dir" ]; then
              echo "::error::Required user data directory is missing: $required_user_data_dir"
              exit 1
            fi
          done

          rm -rf \
            "$USER_REPO_DIR/data/users" \
            "$USER_REPO_DIR/data/user-entry-details" \
            "$USER_REPO_DIR/data/all/users" \
            "$USER_REPO_DIR/data/all/user-entry-details"
          mkdir -p \
            "$USER_REPO_DIR/data/users" \
            "$USER_REPO_DIR/data/user-entry-details" \
            "$USER_REPO_DIR/data/all/users" \
            "$USER_REPO_DIR/data/all/user-entry-details"

          cp -R public/data/users/. "$USER_REPO_DIR/data/users/"
          cp -R public/data/user-entry-details/. "$USER_REPO_DIR/data/user-entry-details/"
          if [ -d public/data/all/users ]; then
            cp -R public/data/all/users/. "$USER_REPO_DIR/data/all/users/"
          fi
          if [ -d public/data/all/user-entry-details ]; then
            cp -R public/data/all/user-entry-details/. "$USER_REPO_DIR/data/all/user-entry-details/"
          fi

          USER_SYNC_MANIFEST="$USER_REPO_DIR/data/sync-manifest.json"
          USER_SYNC_PREVIOUS_MANIFEST="$USER_SYNC_MANIFEST"
          export USER_SYNC_MANIFEST
          export USER_SYNC_PREVIOUS_MANIFEST
          export USER_DATA_SYNC_CHANGED_FILE
          node <<'NODE'
          const fs = require("node:fs");
          const path = require("node:path");
          const crypto = require("node:crypto");

          const workspaceRoot = process.cwd();
          const manifestPath = process.env.USER_SYNC_MANIFEST;
          const previousManifestPath = process.env.USER_SYNC_PREVIOUS_MANIFEST;
          if (!manifestPath) {
            throw new Error("USER_SYNC_MANIFEST is not set");
          }

          function readJson(filePath, fallback = null) {
            try {
              return JSON.parse(fs.readFileSync(filePath, "utf8"));
            } catch (error) {
              return fallback;
            }
          }

          function hashFile(filePath) {
            return crypto.createHash("sha256").update(fs.readFileSync(filePath)).digest("hex");
          }

          function collectFiles(dir, basePath = "") {
            if (!fs.existsSync(dir)) {
              return [];
            }

            let files = [];
            const entries = fs
              .readdirSync(dir, { withFileTypes: true })
              .sort((left, right) => left.name.localeCompare(right.name, "en"));

            for (const entry of entries) {
              const next = path.join(dir, entry.name);
              const relativePath = basePath ? `${basePath}/${entry.name}` : entry.name;

              if (entry.isDirectory()) {
                files = files.concat(collectFiles(next, relativePath));
              } else if (entry.isFile()) {
                const stats = fs.statSync(next);
                files.push({
                  path: relativePath,
                  size_bytes: stats.size,
                  sha256: hashFile(next),
                });
              }
            }

            return files;
          }

          function makeSectionSignature(relativeDir) {
            const files = collectFiles(path.join(workspaceRoot, relativeDir));
            const signatureInput = files.map((file) => `${file.path}:${file.size_bytes}:${file.sha256}`);
            const totalSize = files.reduce((sum, file) => sum + file.size_bytes, 0);

            return {
              file_count: files.length,
              total_size_bytes: totalSize,
              signature: crypto.createHash("sha256").update(signatureInput.join("|")).digest("hex"),
            };
          }

          function buildUsersDataSignature() {
            const sections = {
              users: makeSectionSignature("public/data/users"),
              user_entry_details: makeSectionSignature("public/data/user-entry-details"),
              all_users: makeSectionSignature("public/data/all/users"),
              all_user_entry_details: makeSectionSignature("public/data/all/user-entry-details"),
            };
            const signatureInput = Object.entries(sections)
              .map(([name, section]) => `${name}:${section.file_count}:${section.total_size_bytes}:${section.signature}`)
              .sort();

            return {
              sections,
              data_signature: crypto.createHash("sha256").update(signatureInput.join("|")).digest("hex"),
            };
          }

          const usersData = buildUsersDataSignature();
          const previousManifest = readJson(previousManifestPath, null);
          const globalStats = readJson(path.join(workspaceRoot, "public/data/global_stats.json"), null);
          const manifest = {
            schema_version: 1,
            source: {
              repository: process.env.GITHUB_REPOSITORY || null,
              branch: process.env.GITHUB_REF_NAME || null,
              head_sha: process.env.GITHUB_SHA || null,
              event: process.env.GITHUB_EVENT_NAME || null,
            },
            source_snapshot: {
              generated_at_iso: globalStats?.generated_at_iso || null,
              rankings_updated_at_iso: globalStats?.rankings_updated_at_iso || null,
              total_character_count: globalStats?.total_character_count ?? null,
              total_entry_count: globalStats?.total_entry_count ?? null,
              source_commit: process.env.GITHUB_SHA || null,
            },
            users_data_signature: usersData.data_signature,
            users_data_counts: {
              users: usersData.sections.users.file_count,
              user_entry_details: usersData.sections.user_entry_details.file_count,
              all_users: usersData.sections.all_users.file_count,
              all_user_entry_details: usersData.sections.all_user_entry_details.file_count,
            },
            users_data_sections: usersData.sections,
            sync_status: {
              generated_at_iso: new Date().toISOString(),
              has_content_change: false,
            },
          };
          manifest.source_snapshot.checksum = crypto
            .createHash("sha256")
            .update(JSON.stringify(manifest.source_snapshot))
            .update(JSON.stringify(manifest.users_data_counts))
            .update(JSON.stringify(manifest.users_data_sections))
            .digest("hex");

          const hasContentChange =
            !previousManifest ||
            previousManifest.users_data_signature !== manifest.users_data_signature;
          manifest.sync_status.has_content_change = hasContentChange;

          fs.writeFileSync(process.env.USER_DATA_SYNC_CHANGED_FILE, hasContentChange ? "true" : "false", "utf8");
          fs.writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`, "utf8");
          NODE

          cd "$USER_REPO_DIR"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all data/users data/user-entry-details data/all/users data/all/user-entry-details data/sync-manifest.json

          USER_DATA_SYNC_CHANGED="$(tr -d '[:space:]' < "$USER_DATA_SYNC_CHANGED_FILE" 2>/dev/null || true)"
          rm -f "$USER_DATA_SYNC_CHANGED_FILE"
          USER_DATA_DIR_CHANGED="$(git status --porcelain -- data/users data/user-entry-details data/all/users data/all/user-entry-details)"
          USER_DATA_REPO_CHANGED="$(git status --porcelain -- data/users data/user-entry-details data/all/users data/all/user-entry-details data/sync-manifest.json)"

          if { [ "$USER_DATA_SYNC_CHANGED" = "true" ] || [ -n "$USER_DATA_DIR_CHANGED" ]; } && [ -n "$USER_DATA_REPO_CHANGED" ]; then
            git commit \
              -m "chore(data): 同步個人成績單資料到專用資料庫" \
              -m "將最新生成的使用者排行榜資料同步到外部 users Repo，主站僅保留公開資料。" \
              -m "資料同步來源：public/data/users、public/data/user-entry-details、public/data/all/users、public/data/all/user-entry-details。"
            pushed=false
            for attempt in 1 2 3; do
              git fetch origin main
              git rebase "origin/main"
              if git push origin "HEAD:main"; then
                pushed=true
                break
              fi
              sleep $((attempt * 5))
            done
            if [ "$pushed" != true ]; then
              echo "Push user data changes failed after retries."
              exit 1
            fi
          elif [ -n "$USER_DATA_REPO_CHANGED" ]; then
            echo "Only user-data sync metadata changed; skip commit to avoid noisy history."
          else
            echo "No user-data changes to sync."
          fi

      - name: Remove user data from public data before page build
        run: |
          rm -rf public/data/users public/data/user-entry-details public/data/all/users public/data/all/user-entry-details

      - name: 寫入更新執行戳記
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          let globalStats = null;
          try {
            globalStats = JSON.parse(fs.readFileSync("public/data/global_stats.json", "utf8"));
          } catch {
            globalStats = null;
          }

          const runId = process.env.GITHUB_RUN_ID || null;
          const repository = process.env.GITHUB_REPOSITORY || null;
          const status = {
            schema_version: 1,
            updated_at_iso: new Date().toISOString(),
            event: process.env.GITHUB_EVENT_NAME || null,
            branch: process.env.GITHUB_REF_NAME || null,
            head_sha: process.env.GITHUB_SHA || null,
            run_id: runId,
            run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 0) || null,
            run_url: repository && runId ? `https://github.com/${repository}/actions/runs/${runId}` : null,
            rankings_updated_at_iso: globalStats?.rankings_updated_at_iso ?? null,
            total_character_count: globalStats?.total_character_count ?? null,
            total_entry_count: globalStats?.total_entry_count ?? null,
          };

          fs.mkdirSync("data", { recursive: true });
          fs.writeFileSync("data/update_status.json", `${JSON.stringify(status, null, 2)}\n`, "utf8");
          NODE

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 安裝 OG 圖中文字型
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 建置並驗證 GitHub Pages 靜態網站
        id: build-site
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || secrets.VITE_GA_MEASUREMENT_ID }}
        run: |
          START_SECONDS=$SECONDS
          npx vite build
          npm run postbuild
          BUILD_SECONDS=$((SECONDS - START_SECONDS))
          echo "PAGES_BUILD_SECONDS=${BUILD_SECONDS}" >> "$GITHUB_ENV"
          echo "build_seconds=${BUILD_SECONDS}" >> "$GITHUB_OUTPUT"

      - name: 壓縮 state 並檢查 Git 單檔大小
        run: |
          # data/state.json 會保留大量 checked_reports 快取，不能為了縮小檔案任意刪除。
          # 提交前先移除可安全重建的 checkpoint 與 JSON 空白，避免 push 時才被 GitHub 單檔 100 MiB 限制擋下。
          npm run compact:state -- --max-bytes 104857600

      - name: 檢查排行榜資料是否有變動
        id: data-changes
        run: |
          # build:user-data 與 build:honey-fans 會產生多個公開資料 JSON。這裡與下方 git add 必須使用同一批路徑，
          # 否則 commit 後仍可能留下未暫存變更，導致後續 rebase 被 Git 拒絕。
          DATA_PATHS=(data public/data public/data/fun)
          if [ -n "$(git status --porcelain -- "${DATA_PATHS[@]}")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit 並 Push 排行榜資料
        if: steps.data-changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          DATA_PATHS=(data public/data public/data/fun)
          git add --all -- "${DATA_PATHS[@]}"
          git commit \
            -m "chore(data): 自動更新排行榜資料" \
            -m "原因：GitHub Actions 定時同步 FFLogs 公開報告，讓靜態網站資料保持最新。" \
            -m "主要變更：更新 data 與 public/data 內的排行榜、個人成績單、全服統計、Honey B. Lovely 粉絲榜或更新狀態產物。" \
            -m "測試/驗證：本 workflow 已完成 fetch_fflogs.py、fetch:honey-fans、validate:data 與 npm run build。"
          # rebase 前工作樹必須乾淨；若未來資料建置新增了已追蹤產物但忘記納入 DATA_PATHS，
          # 這裡會列出漏掉的檔案，避免只看到 Git 的「cannot rebase: You have unstaged changes」。
          if [ -n "$(git status --porcelain --untracked-files=no)" ]; then
            echo "::error::資料提交後仍有未提交的已追蹤檔案，請確認 DATA_PATHS 是否漏掉新的資料產物。"
            git status --short --untracked-files=no
            exit 1
          fi
          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push was rejected, retrying after syncing remote branch..."
            sleep $((attempt * 5))
          done
          echo "Unable to push ranking data after syncing remote branch."
          exit 1

      - name: 稽核 GitHub Pages payload 體積
        env:
          PAGES_BUILD_SECONDS: ${{ steps.build-site.outputs.build_seconds }}
          PAGES_PAYLOAD_HISTORY_LIMIT: ${{ vars.PAGES_PAYLOAD_HISTORY_LIMIT || '200' }}
        run: |
          npm run audit:pages-payload:strict -- \
            --write-history data/pages_payload_history.jsonl \
            --history-limit "${PAGES_PAYLOAD_HISTORY_LIMIT:-200}"

      - name: Commit 並 Push payload 稽核歷史
        run: |
          if [ -z "$(git status --porcelain -- data/pages_payload_history.jsonl)" ]; then
            echo "payload 稽核歷史沒有變更，略過提交。"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/pages_payload_history.jsonl
          git commit \
            -m "chore(data): 更新 Pages payload 稽核歷史" \
            -m "原因：GitHub Actions 在資料提交後、Pages artifact 上傳前記錄 payload 體積趨勢。" \
            -m "主要變更：更新 data/pages_payload_history.jsonl，保存 Pages payload 檔案數、大小與趨勢紀錄。" \
            -m "測試/驗證：本 workflow 已完成 npm run audit:pages-payload:strict。"
          for attempt in 1 2 3; do
            git fetch origin "${{ github.ref_name }}"
            git rebase "origin/${{ github.ref_name }}"
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "Push was rejected, retrying after syncing remote branch..."
            sleep $((attempt * 5))
          done
          echo "Unable to push payload audit history after syncing remote branch."
          exit 1

      - name: 估算 Cloudflare 快取承載量
        run: npm run cloudflare:estimate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 檢查 Cloudflare purge 範圍
        env:
          CLOUDFLARE_HOSTNAME: ${{ vars.CLOUDFLARE_HOSTNAME }}
        run: npm run cloudflare:purge -- --dry-run --summary

      - name: 上傳 GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 部署 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: 清除 Cloudflare CDN 快取
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_HOSTNAME: ${{ vars.CLOUDFLARE_HOSTNAME }}
        run: npm run cloudflare:purge
