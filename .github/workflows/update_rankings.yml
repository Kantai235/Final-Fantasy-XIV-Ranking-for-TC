name: 更新排行榜資料

on:
  push:
    branches:
      - main
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-rankings-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'push' }}

jobs:
  update-rankings:
    name: 抓取 FFLogs 並更新排行榜
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout 儲存庫程式碼
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          # 資料 repo 的歷史 pack 已累積到數 GiB；workflow 只需要目前分支內容與後續資料提交，
          # 不需要完整 Git 歷史。使用淺層 partial clone 可避免 GitHub-hosted runner 在 checkout 階段耗盡磁碟。
          # 自動化資料 commit 會以 amend 收斂為單一尾端快照；至少取得 parent commit，
          # 避免 shallow HEAD 在 amend 時被 Git 當成 root 而意外切斷程式碼歷史。
          fetch-depth: 2
          filter: blob:none

      - name: 同步最新分支狀態
        run: |
          git fetch --depth=2 origin "${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: 記錄戰鬥完整性規則版本
        run: |
          # 排程工作可能在規則更新前啟動、卻在更新後才準備推送資料。記住起始
          # revision，提交前再和遠端比對，避免這類舊 runner 把過期 valid 結論回寫。
          RULE_FILES=(
            scripts/fight_integrity.py
            scripts/fight_integrity_known_capacity.py
            config/fflogs.json
            config/fight_integrity_known_enemy_hp.json
          )
          : > "$RUNNER_TEMP/fight-integrity-rule-revisions.txt"
          for file in "${RULE_FILES[@]}"; do
            printf '%s %s\n' "$file" "$(git rev-parse "HEAD:$file")" >> "$RUNNER_TEMP/fight-integrity-rule-revisions.txt"
          done

      # 此快取只含彙總敵方承傷、生命池與目標數，不含 raw events 或排行榜來源資料。
      # 每輪使用新 key 保存，並以前綴取回最近快取，讓中斷的檢核不會浪費已用的 FFLogs 額度。
      - name: 還原戰鬥完整性最小測量快取
        id: fight-integrity-cache
        uses: actions/cache/restore@v4
        with:
          path: data/local-cache/fight-integrity
          key: fflogs-fight-integrity-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            fflogs-fight-integrity-v1-

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: 安裝 Python 依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安裝 Node.js 依賴套件
        run: npm ci

      - name: 同步 Cloudflare CDN 規則
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_RULES_API_TOKEN: ${{ secrets.CLOUDFLARE_RULES_API_TOKEN }}
          CLOUDFLARE_HOSTNAME: ${{ vars.CLOUDFLARE_HOSTNAME }}
          CLOUDFLARE_MANAGE_RATE_LIMIT: ${{ vars.CLOUDFLARE_MANAGE_RATE_LIMIT }}
        run: |
          if [ -z "$CLOUDFLARE_RULES_API_TOKEN" ]; then
            echo "未設定 CLOUDFLARE_RULES_API_TOKEN，略過 Cloudflare Cache Rules / Rate Limiting Rules 同步。"
            exit 0
          fi

          CLOUDFLARE_APPLY_ARGS=(--allow-transient-failure)
          if [ "$CLOUDFLARE_MANAGE_RATE_LIMIT" = "false" ]; then
            CLOUDFLARE_APPLY_ARGS+=(--skip-rate-limit)
          fi
          npm run cloudflare:apply -- "${CLOUDFLARE_APPLY_ARGS[@]}"

      - name: 讀取 FFLogs 待收錄名單
        id: fflogs-refresh-queue
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}
          FFLOGS_REFRESH_QUEUE_SPREADSHEET_ID: ${{ vars.FFLOGS_REFRESH_QUEUE_SPREADSHEET_ID || secrets.FFLOGS_REFRESH_QUEUE_SPREADSHEET_ID }}
          FFLOGS_REFRESH_QUEUE_SHEET_NAME: ${{ vars.FFLOGS_REFRESH_QUEUE_SHEET_NAME || 'pending' }}
          FFLOGS_REFRESH_QUEUE_MAX_CODES: ${{ vars.FFLOGS_REFRESH_QUEUE_MAX_CODES || '50' }}
          FFLOGS_REFRESH_QUEUE_EXTRA_REPORT_CODES: ${{ vars.FFLOGS_RETRY_REPORT_CODES }}
        run: node scripts/read_fflogs_refresh_queue.mjs

      - name: 執行 FFLogs 排行榜抓取腳本
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
          FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
          FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
          FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
          # 玩家可能把繁中服角色的 report 上傳到其他地區；workflow 掃全部地區候選，再由 Python 以伺服器名稱篩繁中服玩家。
          FFLOGS_REPORT_REGION_SCOPE: ${{ vars.FFLOGS_REPORT_REGION_SCOPE || 'all' }}
          # 近期完整重查只回溯 24 小時；這段會放行近期 no-clear report 重新深查，避免剛匯出的 kill 被快取擋住。
          FFLOGS_INCREMENTAL_LOOKBACK_HOURS: ${{ vars.FFLOGS_INCREMENTAL_LOOKBACK_HOURS || '24' }}
          # 近期 report 可能先被掃到但尚未出現通關 fight；保留 24 小時重試窗，避免 skipped_no_clear 永久擋掉後續匯出的 kill。
          FFLOGS_NO_CLEAR_RETRY_HOURS: ${{ vars.FFLOGS_NO_CLEAR_RETRY_HOURS || '24' }}
          # 延遲淺層掃描固定檢查 24-72 小時前的 reports；一般只選入未知 report，
          # 但 UCoB 通關規則與混合上傳分派版本更新時，會讓需要重判的既有 report 穿透快取。
          FFLOGS_DELAYED_SCAN_ENABLED: ${{ vars.FFLOGS_DELAYED_SCAN_ENABLED || 'true' }}
          FFLOGS_DELAYED_SCAN_RECENT_GAP_HOURS: ${{ vars.FFLOGS_DELAYED_SCAN_RECENT_GAP_HOURS || '24' }}
          FFLOGS_DELAYED_SCAN_LOOKBACK_HOURS: ${{ vars.FFLOGS_DELAYED_SCAN_LOOKBACK_HOURS || '72' }}
          FFLOGS_DELAYED_MAX_DEEP_REPORTS_PER_RUN: ${{ vars.FFLOGS_DELAYED_MAX_DEEP_REPORTS_PER_RUN || '100' }}
          # config/fflogs.json 預設關閉歷史補查；workflow 以小批量持續推進，避免單輪撞上 GitHub-hosted runner 6 小時硬上限。
          FFLOGS_HISTORY_SCAN_ENABLED: ${{ vars.FFLOGS_HISTORY_SCAN_ENABLED || 'true' }}
          FFLOGS_HISTORY_SCAN_FULL_RUN: ${{ vars.FFLOGS_HISTORY_SCAN_FULL_RUN || 'false' }}
          FFLOGS_HISTORY_SCAN_WINDOW_HOURS: ${{ vars.FFLOGS_HISTORY_SCAN_WINDOW_HOURS || '168' }}
          FFLOGS_HISTORY_SCAN_WINDOWS_PER_RUN: ${{ vars.FFLOGS_HISTORY_SCAN_WINDOWS_PER_RUN || '1' }}
          FFLOGS_HISTORY_SCAN_RECENT_GAP_HOURS: ${{ vars.FFLOGS_HISTORY_SCAN_RECENT_GAP_HOURS || '6' }}
          FFLOGS_HISTORY_MAX_DEEP_REPORTS_PER_RUN: ${{ vars.FFLOGS_HISTORY_MAX_DEEP_REPORTS_PER_RUN || '600' }}
          FFLOGS_HISTORY_MAX_DEEP_REPORTS_PER_GROUP_PER_RUN: ${{ vars.FFLOGS_HISTORY_MAX_DEEP_REPORTS_PER_GROUP_PER_RUN || '150' }}
          # GitHub-hosted runner 有 6 小時硬上限；若 FFLogs 要求長時間憑證冷卻，
          # 讓 fetch_fflogs.py 主動保留 active_scan 後結束，避免後續資料建置與 commit 被 runner 取消。
          FFLOGS_MAX_RUNTIME_SECONDS: ${{ vars.FFLOGS_MAX_RUNTIME_SECONDS || '6000' }}
          FFLOGS_RUNTIME_GRACE_SECONDS: ${{ vars.FFLOGS_RUNTIME_GRACE_SECONDS || '900' }}
          # 每輪優先抽查尚未巡檢的較新 report，之後依最久未巡檢順序輪替。
          FFLOGS_EXISTING_REPORT_STATUS_CHECK_ENABLED: ${{ vars.FFLOGS_EXISTING_REPORT_STATUS_CHECK_ENABLED || 'true' }}
          FFLOGS_EXISTING_REPORT_STATUS_CHECK_LIMIT: ${{ vars.FFLOGS_EXISTING_REPORT_STATUS_CHECK_LIMIT || '25' }}
          # 新 report 抓取時順手查同一場 Casts graph 並以本地演算法計算 GCD，只保存衍生結果。
          FFLOGS_FETCH_GCD_COVERAGE_ENABLED: ${{ vars.FFLOGS_FETCH_GCD_COVERAGE_ENABLED || 'true' }}
          FFLOGS_FETCH_GCD_COVERAGE_MAX_FIGHTS_PER_RUN: ${{ vars.FFLOGS_FETCH_GCD_COVERAGE_MAX_FIGHTS_PER_RUN || '150' }}
        run: python scripts/fetch_fflogs.py

      - name: 輸出混合上傳分派完成度
        env:
          FFLOGS_HISTORY_SCAN_WINDOW_HOURS: ${{ vars.FFLOGS_HISTORY_SCAN_WINDOW_HOURS || '168' }}
          FFLOGS_HISTORY_SCAN_WINDOWS_PER_RUN: ${{ vars.FFLOGS_HISTORY_SCAN_WINDOWS_PER_RUN || '1' }}
        run: npm run audit:mixed-report-dispatch

      - name: 執行 Honey B. Lovely 粉絲榜抓取腳本
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
          FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
          FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
          FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
          HONEY_FANS_RECENT_DAYS: ${{ vars.HONEY_FANS_RECENT_DAYS || '3' }}
          HONEY_FANS_HISTORY_LIMIT: ${{ vars.HONEY_FANS_HISTORY_LIMIT || '200' }}
          HONEY_FANS_RECENT_WINDOW_HOURS: ${{ vars.HONEY_FANS_RECENT_WINDOW_HOURS || '24' }}
          HONEY_FANS_HISTORY_WINDOW_HOURS: ${{ vars.HONEY_FANS_HISTORY_WINDOW_HOURS || '24' }}
        run: |
          npm run fetch:honey-fans -- \
            --recent-days "${HONEY_FANS_RECENT_DAYS:-3}" \
            --history-limit "${HONEY_FANS_HISTORY_LIMIT:-200}" \
            --recent-window-hours "${HONEY_FANS_RECENT_WINDOW_HOURS:-24}" \
            --history-window-hours "${HONEY_FANS_HISTORY_WINDOW_HOURS:-24}"

      # 舊版資料修補工具暫停每輪自動執行，避免排程重複回查已不常需要補齊的歷史 report。
      # 若未來需要人工修復既有缺漏，保留以下步驟作為手動恢復時的上下文。
      # - name: 補齊缺漏 FFLogs 原始資料
      #   env:
      #     FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
      #     FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
      #     FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
      #     FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
      #     FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
      #   run: python scripts/backfill_missing_fflogs_data.py --limit 250

      - name: 由 7.2 切點往舊回補坦補支援統計
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
          FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
          FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
          FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
          FFLOGS_SUPPORT_METRICS_BACKFILL_REPORT_LIMIT: ${{ vars.FFLOGS_SUPPORT_METRICS_BACKFILL_REPORT_LIMIT || '25' }}
          FFLOGS_SUPPORT_METRICS_BACKFILL_CUTOFF_ISO: ${{ vars.FFLOGS_SUPPORT_METRICS_BACKFILL_CUTOFF_ISO || '2026-07-28T05:00:00Z' }}
        run: |
          SUPPORT_REPORT_LIMIT="${FFLOGS_SUPPORT_METRICS_BACKFILL_REPORT_LIMIT:-25}"
          if [ "$SUPPORT_REPORT_LIMIT" = "0" ]; then
            echo "FFLOGS_SUPPORT_METRICS_BACKFILL_REPORT_LIMIT=0，略過坦補支援統計歷史回補。"
            exit 0
          fi
          python scripts/backfill_missing_fflogs_data.py \
            --stateful-support-metrics-backfill \
            --limit "$SUPPORT_REPORT_LIMIT" \
            --checkpoint-every 10

      - name: 補齊近期 report 的 GCD 空洞
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
          FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
          FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
          FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
          # 不使用 stateful cutoff，專門追最新候選，避免 cutoff 之後才新增或重算版本提升的 report 長期留空。
          FFLOGS_RECENT_GCD_BACKFILL_REPORT_LIMIT: ${{ vars.FFLOGS_RECENT_GCD_BACKFILL_REPORT_LIMIT || '25' }}
        run: |
          RECENT_GCD_LIMIT="${FFLOGS_RECENT_GCD_BACKFILL_REPORT_LIMIT:-25}"
          if [ "$RECENT_GCD_LIMIT" = "0" ]; then
            echo "FFLOGS_RECENT_GCD_BACKFILL_REPORT_LIMIT=0，略過近期 GCD 補洞。"
            exit 0
          fi
          python scripts/backfill_gcd_coverage.py \
            --report-limit "$RECENT_GCD_LIMIT"

      - name: 由新往舊補齊既有 report 的 GCD 覆蓋率
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
          FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
          FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
          FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
          FFLOGS_GCD_BACKFILL_REPORT_LIMIT: ${{ vars.FFLOGS_GCD_BACKFILL_REPORT_LIMIT || '50' }}
          FFLOGS_GCD_BACKFILL_CUTOFF_ISO: ${{ vars.FFLOGS_GCD_BACKFILL_CUTOFF_ISO }}
        run: |
          python scripts/backfill_gcd_coverage.py \
            --stateful-report-backfill \
            --report-limit "${FFLOGS_GCD_BACKFILL_REPORT_LIMIT:-50}"

      - name: 分批檢核 7.28 後戰鬥的傷害完整性
        env:
          FFLOGS_CLIENT_ID: ${{ secrets.FFLOGS_CLIENT_ID }}
          FFLOGS_CLIENT_SECRET: ${{ secrets.FFLOGS_CLIENT_SECRET }}
          FFLOGS_CLIENT_IDS: ${{ secrets.FFLOGS_CLIENT_IDS }}
          FFLOGS_CLIENT_SECRETS: ${{ secrets.FFLOGS_CLIENT_SECRETS }}
          FFLOGS_CLIENT_CREDENTIALS_JSON: ${{ secrets.FFLOGS_CLIENT_CREDENTIALS_JSON }}
          # 這是可撤除的暫時性防護：停用後不再新增檢核，但既有 data_integrity 標記仍會由建置層隱藏。
          FFLOGS_FIGHT_INTEGRITY_ENABLED: ${{ vars.FFLOGS_FIGHT_INTEGRITY_ENABLED || 'true' }}
          FFLOGS_FIGHT_INTEGRITY_REPORT_LIMIT: ${{ vars.FFLOGS_FIGHT_INTEGRITY_REPORT_LIMIT || '25' }}
        run: |
          INTEGRITY_REPORT_LIMIT="${FFLOGS_FIGHT_INTEGRITY_REPORT_LIMIT:-25}"
          if [ "$INTEGRITY_REPORT_LIMIT" = "0" ]; then
            echo "FFLOGS_FIGHT_INTEGRITY_REPORT_LIMIT=0，略過本輪傷害完整性檢核。"
            exit 0
          fi
          python scripts/backfill_fight_integrity.py --report-limit "$INTEGRITY_REPORT_LIMIT"

      - name: 確認戰鬥完整性測量快取可保存
        if: always()
        id: fight-integrity-cache-state
        run: |
          if [ -s data/local-cache/fight-integrity/measurements.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 保存戰鬥完整性最小測量快取
        if: always() && steps.fight-integrity-cache-state.outputs.exists == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/local-cache/fight-integrity
          key: fflogs-fight-integrity-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: 分割完整排行榜資料供 Git 追蹤
        run: python scripts/fetch_fflogs.py --split-rankings

      - name: 產生個人成績單與排行榜薄索引資料
        run: npm run build:user-data

      - name: 重建 Honey B. Lovely 粉絲榜公開資料
        run: npm run build:honey-fans

      - name: 驗證公開資料契約
        run: npm run validate:data

      # users repo 只承載可重建的部署快照；同步腳本以單一 root commit 搭配
      # force-with-lease 更新，避免每 30 分鐘累積整批 JSON 的 Git 歷史。
      - name: 同步個人成績單資料到專用 repo（單一快照）
        env:
          GIT_PAT: ${{ secrets.GIT_PAT }}
        run: node scripts/sync_user_leaderboard_repo.mjs

      - name: 寫入更新執行戳記
        run: |
          node <<'NODE'
          const fs = require("node:fs");

          let globalStats = null;
          try {
            globalStats = JSON.parse(fs.readFileSync("public/data/global_stats.json", "utf8"));
          } catch {
            globalStats = null;
          }

          const runId = process.env.GITHUB_RUN_ID || null;
          const repository = process.env.GITHUB_REPOSITORY || null;
          const status = {
            schema_version: 1,
            updated_at_iso: new Date().toISOString(),
            event: process.env.GITHUB_EVENT_NAME || null,
            branch: process.env.GITHUB_REF_NAME || null,
            head_sha: process.env.GITHUB_SHA || null,
            run_id: runId,
            run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT || 0) || null,
            run_url: repository && runId ? `https://github.com/${repository}/actions/runs/${runId}` : null,
            rankings_updated_at_iso: globalStats?.rankings_updated_at_iso ?? null,
            total_character_count: globalStats?.total_character_count ?? null,
            total_entry_count: globalStats?.total_entry_count ?? null,
          };

          fs.mkdirSync("data", { recursive: true });
          fs.writeFileSync("data/update_status.json", `${JSON.stringify(status, null, 2)}\n`, "utf8");
          NODE
          npm run build:public-status

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v6

      - name: 安裝 OG 圖中文字型
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk

      - name: 建置並驗證 GitHub Pages 靜態網站
        id: build-site
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_USER_DATA_BASE_URL: ${{ vars.VITE_USER_DATA_BASE_URL }}
          VITE_USER_INDEX_BASE_URL: ${{ vars.VITE_USER_INDEX_BASE_URL }}
          # 逐玩家靜態分享頁與 OG PNG 會產生上萬個小檔，GitHub Pages 同步 artifact 時容易在 syncing_files 階段失敗。
          # 個人成績單索引保留在主站 /data/users/index.json；個別玩家檔案仍由 /user route 的 SPA 與 users 專用 repo 提供。
          # 副本、職業、伺服器等低基數 SEO 頁仍照常產生。
          FFXIV_TC_BUILD_USER_SHARE_PAGES: ${{ vars.FFXIV_TC_BUILD_USER_SHARE_PAGES || 'false' }}
        run: |
          START_SECONDS=$SECONDS
          npx vite build
          npm run postbuild
          BUILD_SECONDS=$((SECONDS - START_SECONDS))
          echo "PAGES_BUILD_SECONDS=${BUILD_SECONDS}" >> "$GITHUB_ENV"
          echo "build_seconds=${BUILD_SECONDS}" >> "$GITHUB_OUTPUT"

      - name: 從 Pages artifact 移除個人成績單部署資料
        run: |
          # postbuild 在本機抽查或開啟逐玩家分享頁時，才需要 public/data/users/index.json 產生玩家頁與 OG 圖。
          # 正式部署預設不產生逐玩家靜態分享頁；若本機或緊急流程曾產生，prune 也會一併清掉玩家頁與玩家 OG 圖。
          # 建置完成後刪 dist/data 的大型使用者 JSON；前端實際由專用 users repo 載入個人成績單。
          npm run prune:pages-user-data

      - name: 壓縮 state 並檢查 Git 單檔大小
        run: |
          # data/state.json 會保留大量 checked_reports 快取，不能為了縮小檔案任意刪除。
          # 提交前先移除可安全重建的 checkpoint 與 JSON 空白，避免 push 時才被 GitHub 單檔 100 MiB 限制擋下。
          npm run compact:state -- --max-bytes 104857600

      - name: 檢查排行榜資料是否有變動
        id: data-changes
        run: |
          # build:user-data 與 build:honey-fans 會產生多個公開資料 JSON。這裡與下方 git add 必須使用同一批路徑，
          # 否則 commit 後仍可能留下未暫存變更，導致後續 rebase 被 Git 拒絕。
          DATA_PATHS=(data public/data public/data/fun)
          if [ -n "$(git status --porcelain -- "${DATA_PATHS[@]}")" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 建立並 Push 自動化資料快照
        if: steps.data-changes.outputs.changed == 'true'
        run: |
          DATA_PATHS=(data public/data public/data/fun)
          git fetch --depth=2 origin "${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}"
          while IFS=' ' read -r file expected_revision; do
            remote_revision="$(git rev-parse "origin/${{ github.ref_name }}:$file")"
            if [ "$remote_revision" != "$expected_revision" ]; then
              echo "::error::戰鬥完整性規則在本輪執行期間已更新；拒絕回寫過期完整性結果。"
              exit 1
            fi
          done < "$RUNNER_TEMP/fight-integrity-rule-revisions.txt"
          # 每個人工程式碼 commit 後最多保留一筆資料快照。新排程會 amend 舊快照，
          # 並用明確舊 SHA 的 force-with-lease 阻止競爭時覆寫新程式碼。
          node scripts/commit_workflow_data_snapshot.mjs \
            --branch "${{ github.ref_name }}" \
            -- "${DATA_PATHS[@]}"

      - name: 更新 FFLogs 待收錄名單結果
        continue-on-error: true
        env:
          GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SHEETS_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SHEETS_CLIENT_EMAIL: ${{ secrets.GOOGLE_SHEETS_CLIENT_EMAIL }}
          GOOGLE_SHEETS_PRIVATE_KEY: ${{ secrets.GOOGLE_SHEETS_PRIVATE_KEY }}
          FFLOGS_REFRESH_QUEUE_SPREADSHEET_ID: ${{ vars.FFLOGS_REFRESH_QUEUE_SPREADSHEET_ID || secrets.FFLOGS_REFRESH_QUEUE_SPREADSHEET_ID }}
          FFLOGS_REFRESH_QUEUE_SHEET_NAME: ${{ vars.FFLOGS_REFRESH_QUEUE_SHEET_NAME || 'pending' }}
          FFLOGS_REFRESH_QUEUE_COMPLETE_MAX_ROWS: ${{ vars.FFLOGS_REFRESH_QUEUE_COMPLETE_MAX_ROWS || '500' }}
          FFLOGS_REFRESH_QUEUE_COMPLETE_INCLUDE_HIDDEN: ${{ vars.FFLOGS_REFRESH_QUEUE_COMPLETE_INCLUDE_HIDDEN || 'false' }}
        run: npm run complete:fflogs-refresh-queue

      - name: 稽核 GitHub Pages payload 體積
        env:
          PAGES_BUILD_SECONDS: ${{ steps.build-site.outputs.build_seconds }}
          PAGES_PAYLOAD_HISTORY_LIMIT: ${{ vars.PAGES_PAYLOAD_HISTORY_LIMIT || '200' }}
        run: |
          npm run audit:pages-payload:strict -- \
            --write-history data/pages_payload_history.jsonl \
            --history-limit "${PAGES_PAYLOAD_HISTORY_LIMIT:-200}"

      - name: 將 payload 稽核收斂進自動化資料快照
        run: |
          node scripts/commit_workflow_data_snapshot.mjs \
            --branch "${{ github.ref_name }}" \
            -- data/pages_payload_history.jsonl

      - name: 估算 Cloudflare 快取承載量
        run: npm run cloudflare:estimate | tee -a "$GITHUB_STEP_SUMMARY"

      - name: 檢查 Cloudflare purge 範圍
        env:
          CLOUDFLARE_HOSTNAME: ${{ vars.CLOUDFLARE_HOSTNAME }}
        run: npm run cloudflare:purge -- --dry-run --summary

      - name: 上傳 GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: 部署 GitHub Pages（第 1 次）
        id: deployment-attempt-1
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          # GitHub Pages 偶爾會在 syncing_files 階段回報暫時性失敗；延長輪詢時間能避免大型 artifact 在尖峰時段太早放棄。
          timeout: "900000"
          error_count: "15"
          reporting_interval: "10000"

      - name: 等待 GitHub Pages 服務端恢復
        if: steps.deployment-attempt-1.outcome == 'failure'
        run: sleep 60

      - name: 部署 GitHub Pages（第 2 次）
        id: deployment-attempt-2
        if: steps.deployment-attempt-1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: "900000"
          error_count: "15"
          reporting_interval: "10000"

      - name: 記錄 GitHub Pages 部署網址
        id: deployment
        if: always()
        run: |
          if [ "${{ steps.deployment-attempt-1.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deployment-attempt-1.outputs.page_url }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.deployment-attempt-2.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deployment-attempt-2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::GitHub Pages 部署重試後仍失敗，請檢查 Pages deployment 狀態或稍後重新執行 workflow。"
          exit 1

      - name: 清除 Cloudflare CDN 快取
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_HOSTNAME: ${{ vars.CLOUDFLARE_HOSTNAME }}
        run: npm run cloudflare:purge
