name: 緊急部署靜態網站

on:
  workflow_dispatch:
    inputs:
      cloudflare_purge_mode:
        description: "部署後的 Cloudflare purge 模式；首頁或 404 快取異常時建議使用 everything。"
        required: true
        default: "everything"
        type: choice
        options:
          - everything
          - scoped

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: emergency-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emergency-deploy:
    name: 不抓 FFLogs，直接建置並部署
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout 儲存庫程式碼
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          # 緊急部署只需要目前程式碼；權威資料會另由 Data repo 快照載入。
          fetch-depth: 1
          filter: blob:none

      - name: 同步最新分支狀態
        run: |
          git fetch --depth=1 origin "${{ github.ref_name }}:refs/remotes/origin/${{ github.ref_name }}"
          git reset --hard "origin/${{ github.ref_name }}"

      - name: 設定 Python 環境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: 設定 Node.js 環境
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: 安裝 Python 依賴套件
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安裝 Node.js 依賴套件
        run: npm ci

      - name: 從 Data repo 還原最新權威資料
        env:
          DATA_REPO: Kantai235/Final-Fantasy-XIV-Ranking-for-TC-Data
        run: npm run data:hydrate

      - name: 設定 GitHub Pages
        uses: actions/configure-pages@v6

      # 與正式排程共用同一份字型快取；緊急部署不應再次承受 Ubuntu mirror
      # 暫時降速，也不能因快取服務短暫失敗而阻止本輪已準備好的字型繼續建置。
      - name: 還原 OG 圖中文字型快取
        id: og-font-cache
        continue-on-error: true
        uses: actions/cache/restore@v5
        with:
          path: ~/.local/share/fonts/ffxiv-og
          key: og-fonts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup_og_fonts.sh') }}

      - name: 準備 OG 圖中文字型
        run: bash scripts/setup_og_fonts.sh

      - name: 保存 OG 圖中文字型快取
        if: steps.og-font-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ~/.local/share/fonts/ffxiv-og
          key: og-fonts-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/setup_og_fonts.sh') }}

      - name: 建置並驗證 GitHub Pages 靜態網站
        env:
          VITE_GA_MEASUREMENT_ID: ${{ vars.VITE_GA_MEASUREMENT_ID || secrets.VITE_GA_MEASUREMENT_ID }}
          VITE_USER_DATA_BASE_URL: ${{ vars.VITE_USER_DATA_BASE_URL }}
          VITE_USER_INDEX_BASE_URL: ${{ vars.VITE_USER_INDEX_BASE_URL }}
          # 緊急部署同樣避免把上萬個逐玩家分享頁與玩家 OG PNG 放進 Pages artifact。
          FFXIV_TC_BUILD_USER_SHARE_PAGES: ${{ vars.FFXIV_TC_BUILD_USER_SHARE_PAGES || 'false' }}
        run: |
          # 緊急部署只使用剛由 Data repo 驗證並還原的 data/ 與 public/data/ 快照。
          # npm run build 會執行 --rebuild-public、build:user-data 與 validate:data，
          # 但不會呼叫 FFLogs API、推進 state 掃描點或提交任何資料更新。
          npm run build

      - name: 從 Pages artifact 移除個人成績單部署資料
        run: |
          # 緊急部署同樣只讓主站 artifact 保留共用使用者索引與非使用者資料；
          # 逐玩家靜態分享頁與玩家 OG 圖不部署；個別玩家 JSON 由 users repo 提供，玩家路徑由 SPA 接手。
          npm run prune:pages-user-data

      - name: 上傳 GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: 部署 GitHub Pages（第 1 次）
        id: deployment-attempt-1
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          # GitHub Pages 偶爾會在 syncing_files 階段回報暫時性失敗；緊急部署也要給服務端一次恢復機會。
          timeout: "900000"
          error_count: "15"
          reporting_interval: "10000"

      - name: 等待 GitHub Pages 服務端恢復
        if: steps.deployment-attempt-1.outcome == 'failure'
        run: sleep 60

      - name: 部署 GitHub Pages（第 2 次）
        id: deployment-attempt-2
        if: steps.deployment-attempt-1.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: "900000"
          error_count: "15"
          reporting_interval: "10000"

      - name: 記錄 GitHub Pages 部署網址
        id: deployment
        if: always()
        run: |
          if [ "${{ steps.deployment-attempt-1.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deployment-attempt-1.outputs.page_url }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.deployment-attempt-2.outcome }}" = "success" ]; then
            echo "page_url=${{ steps.deployment-attempt-2.outputs.page_url }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "::error::GitHub Pages 部署重試後仍失敗，請檢查 Pages deployment 狀態或稍後重新執行 workflow。"
          exit 1

      - name: 清除 Cloudflare CDN 快取
        env:
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          CLOUDFLARE_PURGE_API_TOKEN: ${{ secrets.CLOUDFLARE_PURGE_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_HOSTNAME: ${{ vars.CLOUDFLARE_HOSTNAME }}
        run: |
          if [ "${{ inputs.cloudflare_purge_mode }}" = "everything" ]; then
            npm run cloudflare:purge -- --everything
          else
            npm run cloudflare:purge
          fi
